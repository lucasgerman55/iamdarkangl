<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 埃兹拉·Protector v14.0</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0f1e;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif;color:#fff;padding:20px}
        .container{background:rgba(10,20,40,0.95);border-radius:30px;padding:40px;max-width:960px;width:100%;border:1px solid rgba(0,200,255,0.15)}
        .header{text-align:center;margin-bottom:25px}
        .header h1{font-size:1.8rem;background:linear-gradient(135deg,#88ddff,#0066ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header p{color:#6688aa}
        .form-group{margin-bottom:18px}
        .form-group label{display:block;color:#88ccff;margin-bottom:6px;font-weight:600}
        .form-group textarea{width:100%;height:200px;background:#111a2a;color:#c0d0e0;border:1px solid #1a2a44;border-radius:12px;padding:15px;font-family:monospace;font-size:13px;resize:vertical}
        .form-group textarea:focus{outline:none;border-color:#00c8ff}
        .row{display:flex;gap:15px;flex-wrap:wrap}
        .row .form-group{flex:1;min-width:150px}
        .form-group input[type="text"],.form-group input[type="file"]{width:100%;background:#111a2a;color:#c0d0e0;border:1px solid #1a2a44;border-radius:12px;padding:10px 15px;font-size:14px}
        .btn-group-main{display:flex;gap:10px;flex-wrap:wrap}
        .btn{background:linear-gradient(135deg,#00c8ff,#0066ff);border:none;padding:14px;border-radius:60px;font-size:1.1rem;font-weight:700;color:#fff;cursor:pointer;flex:1}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,100,255,0.4)}
        .btn-secondary{background:linear-gradient(135deg,#ff6b6b,#ee5a24);flex:0.5}
        .btn:disabled{opacity:0.6}
        .result{margin-top:20px;display:none}
        .result.active{display:block}
        .result-box{background:#111a2a;border-radius:12px;padding:18px;border:1px solid #1a2a44}
        .result-box .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .result-box .tab-btn{background:#1a2a44;border:none;color:#6688aa;padding:6px 16px;border-radius:30px;cursor:pointer;font-size:.8rem}
        .result-box .tab-btn.active{background:#00c8ff;color:#0a0f1e}
        .result-box .tab-content{display:none;position:relative}
        .result-box .tab-content.active{display:block}
        .result-box .tab-content pre{background:#0a0f1e;padding:12px;border-radius:8px;font-size:11px;line-height:1.5;max-height:350px;overflow:auto;color:#c0d0e0;border:1px solid #1a2a44;white-space:pre-wrap;word-wrap:break-word}
        .result-box .btn-group{display:flex;gap:8px;position:absolute;top:8px;right:8px}
        .result-box .copy-btn,.result-box .download-btn{background:#1a2a44;border:none;color:#88ccff;padding:4px 12px;border-radius:20px;cursor:pointer;font-size:.7rem}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
        .stats .stat-item{background:#0a0f1e;padding:8px;border-radius:8px;text-align:center;border:1px solid #1a2a44}
        .stats .stat-item .label{color:#6688aa;font-size:.6rem;text-transform:uppercase}
        .stats .stat-item .value{color:#88ddff;font-size:.9rem;font-weight:600}
        .stats .stat-item .value.green{color:#66ff88}
        .stats .stat-item .value.gold{color:#ffd700}
        .loader{display:inline-block;width:18px;height:18px;border:3px solid #1a2a44;border-top:3px solid #00c8ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
        @keyframes spin{100%{transform:rotate(360deg)}}
        .toast{position:fixed;bottom:30px;right:30px;background:#1a2a44;color:#88ddff;padding:12px 20px;border-radius:12px;border-left:4px solid #00c8ff;display:none;z-index:999}
        .toast.error{border-left-color:#ff4444;color:#ff6666}
        .toast.success{border-left-color:#66ff88;color:#66ff88}
        .toast.show{display:block}
        .tips{background:#1a2a44;border-radius:12px;padding:10px 15px;margin:12px 0;border-left:4px solid #00c8ff;font-size:.8rem}
        .tips code{color:#88ddff;background:#0a0f1e;padding:2px 8px;border-radius:4px}
        .footer{text-align:center;margin-top:18px;color:#334455;font-size:.65rem;border-top:1px solid #1a2a44;padding-top:12px}
        .badge{background:#ffd700;color:#0a0f1e;padding:2px 10px;border-radius:20px;font-size:.6rem;font-weight:700;margin-left:8px}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛡️ 埃兹拉·Protector v14.0</h1>
        <p>☁️ 云端存储 · 零知识Loader</p>
    </div>

    <div class="tips">💡 代码加密后存储在MySQL，Loader仅包含<span class="badge">FILE_ID</span>，实现零知识安全分发</div>

    <form id="encryptForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="codeInput">📝 Python源代码</label>
            <textarea id="codeInput" name="code" placeholder="粘贴你的Python代码..."># 直接使用SecureVault
vault = SecureVault()
vault.add_record("test", "hello")
print(f"记录数: {vault.count()}")
print("✅ 测试通过")</textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="keyInput">🔑 密钥 (可选)</label>
                <input type="text" id="keyInput" name="key" placeholder="留空使用默认" />
            </div>
            <div class="form-group">
                <label for="fileInput">📁 上传文件</label>
                <input type="file" id="fileInput" name="file" accept=".py,.txt" />
            </div>
        </div>

        <div class="btn-group-main">
            <button type="submit" class="btn" id="submitBtn">🚀 加密并存储到云端</button>
        </div>
    </form>

    <div class="result" id="resultContainer">
        <div class="result-box">
            <div class="tabs">
                <button class="tab-btn active" data-tab="loader">📜 Loader</button>
                <button class="tab-btn" data-tab="info">📊 统计</button>
            </div>

            <div class="tab-content active" id="tab-loader">
                <div class="btn-group">
                    <button class="copy-btn" onclick="copyContent('loader')">📋 复制</button>
                    <button class="download-btn" onclick="downloadFile('loader', 'loader.py')">⬇️ 下载</button>
                </div>
                <pre id="loaderOutput">等待加密...</pre>
            </div>

            <div class="tab-content" id="tab-info">
                <div class="stats" id="statsOutput">
                    <div class="stat-item"><div class="label">📎 File ID</div><div class="value gold" id="statFileId" style="font-size:.7rem;">-</div></div>
                    <div class="stat-item"><div class="label">原始</div><div class="value" id="statOriginal">-</div></div>
                    <div class="stat-item"><div class="label">加密</div><div class="value" id="statEncrypted">-</div></div>
                    <div class="stat-item"><div class="label">Loader</div><div class="value" id="statLoader">-</div></div>
                    <div class="stat-item"><div class="label">SHA256</div><div class="value green" id="statHash" style="font-size:.65rem;">-</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">☁️ 云端加密存储 · 零知识分发 · v14.0</div>
</div>

<div class="toast" id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('encryptForm');
    const submitBtn = document.getElementById('submitBtn');
    const codeInput = document.getElementById('codeInput');
    const fileInput = document.getElementById('fileInput');
    const resultContainer = document.getElementById('resultContainer');

    fileInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            codeInput.value = e.target.result;
            showToast('✅ 已加载: ' + file.name, 'success');
        };
        reader.readAsText(file);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        });
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const code = codeInput.value.trim();
        if (!code) { showToast('⚠️ 请粘贴代码', 'error'); return; }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loader"></span> 加密存储中...';
        resultContainer.classList.remove('active');

        try {
            const formData = new FormData();
            formData.append('code', code);
            const key = document.getElementById('keyInput').value.trim();
            if (key) formData.append('key', key);

            const response = await fetch('encrypt.php', { method: 'POST', body: formData });
            const rawText = await response.text();
            let data;
            try { data = JSON.parse(rawText); } catch(e) { throw new Error('服务器返回错误'); }

            if (data.status === 'success') {
                document.getElementById('loaderOutput').textContent = data.loader;
                document.getElementById('statFileId').textContent = data.file_id;
                document.getElementById('statOriginal').textContent = data.stats.original_size + ' B';
                document.getElementById('statEncrypted').textContent = data.stats.encrypted_size + ' B';
                document.getElementById('statLoader').textContent = data.stats.loader_size + ' B';
                document.getElementById('statHash').textContent = data.stats.sha256.substring(0, 16) + '...';
                resultContainer.classList.add('active');
                showToast('✅ 云端存储成功! ID: ' + data.file_id, 'success');
            } else {
                showToast('❌ 失败: ' + data.message, 'error');
            }
        } catch (error) {
            showToast('❌ 请求失败: ' + error.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🚀 加密并存储到云端';
        }
    });

    window.showToast = function(message, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show' + (type ? ' ' + type : '');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 5000);
    };

    window.copyContent = function(type) {
        const content = document.getElementById(type + 'Output').textContent;
        if (!content || content === '等待加密...') { showToast('⚠️ 没有内容', 'error'); return; }
        navigator.clipboard.writeText(content).then(() => showToast('✅ 已复制', 'success'))
            .catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ 已复制', 'success');
            });
    };

    window.downloadFile = function(type, filename) {
        const content = document.getElementById(type + 'Output').textContent;
        if (!content || content === '等待加密...') { showToast('⚠️ 没有内容', 'error'); return; }
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('✅ 已下载: ' + filename, 'success');
    };
});
</script>
</body>
</html>
